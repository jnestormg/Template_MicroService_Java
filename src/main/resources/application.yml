spring:
  application:
    name: api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://localhost:5432/api
    username: api
    password: api
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: api-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.example.api"
        spring.json.value.default.type: com.example.api.product.event.ProductEvent
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# Carga variables del archivo .env (raiz del proyecto) como propiedades
# de Spring. Los valores del entorno real (Docker/OS) tienen prioridad.
spring-dotenv:
  filename: .env
  location: filesystem
  failOnMissing: false
  prefix:

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  jwt:
    secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWYwMTIzNDU2Nzg5YWJjZGVm
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
    issuer: api
  cors:
    allowed-origins: http://localhost:3000,http://localhost:4200,http://localhost:8080
  kafka:
    product-topic: product-events

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    org.flywaydb: INFO
    org.springframework.security: INFO